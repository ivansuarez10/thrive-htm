<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THRIVE — demo del hero</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/img/seal.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300..700&family=Bodoni+Moda:ital,opsz,wght@1,6..96,400..600&family=Fraunces:opsz,wght,SOFT,WONK@144,400,30,1&family=Hanken+Grotesk:wght@300..800&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/css/thrive.css?v=8e31cf5d">

<style>
  /* ═══════════════════════════════════════════════════════════
     Demo del hero — apertura centrada y animada.
     No toca la landing. Cuando se apruebe, esto pasa al template.
     ═══════════════════════════════════════════════════════════ */

  .abre{
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; position:relative;
    padding:clamp(60px,10vh,110px) clamp(22px,6vw,40px) clamp(80px,12vh,120px);
  }

  /* ── el sello, grande y centrado ── */
  .abre-sello{
    width:clamp(96px,13vw,168px); height:auto;
    animation:selloEntra 1200ms var(--ease) both;
  }
  @keyframes selloEntra{
    from{opacity:0; transform:scale(.78) rotate(-10deg);}
    to  {opacity:1; transform:none;}
  }

  /* ── THRIVE letra por letra, con el tracking asentándose ── */
  .abre-word{
    display:block; margin-top:clamp(26px,4vh,46px);
    font-family:var(--marca); font-weight:400; font-variation-settings:var(--marca-ejes);
    font-size:clamp(2.6rem,11vw,6.4rem); line-height:1;
    letter-spacing:.2em; text-indent:.2em;        /* el indent compensa el tracking del final */
    animation:asienta 1600ms var(--ease) .35s both;
  }
  @keyframes asienta{
    from{letter-spacing:.2em; text-indent:.2em;}
    to  {letter-spacing:.02em; text-indent:.02em;}
  }
  .abre-word i{
    display:inline-block; font-style:normal;
    opacity:0; transform:translateY(.42em);
    animation:letra 780ms var(--ease) forwards;
    animation-delay:calc(.38s + var(--i) * 65ms);
  }
  @keyframes letra{ to{opacity:1; transform:none;} }

  .abre-tag{
    margin-top:clamp(12px,1.6vh,20px);
    font-family:var(--mono); font-size:clamp(.62rem,1.5vw,.78rem);
    letter-spacing:.24em; text-transform:uppercase; color:var(--ink-3);
    opacity:0; animation:sube 900ms var(--ease) 1.05s forwards;
  }
  @keyframes sube{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }

  .abre-linea{
    margin-top:clamp(34px,6vh,64px);
    font-family:var(--display); font-weight:600;
    font-size:clamp(1.55rem,4.4vw,3.1rem); line-height:1.1; letter-spacing:-.025em;
    max-width:17ch;
  }
  .abre-linea em{font-family:var(--serif); font-style:italic; font-weight:500;}
  .abre-linea .mask > span{transform:translateY(108%); animation:revela 1000ms var(--ease) forwards;}
  .abre-linea .m1 > span{animation-delay:1.30s}
  .abre-linea .m2 > span{animation-delay:1.44s}
  .abre-linea .m3 > span{animation-delay:1.58s}
  @keyframes revela{ to{transform:translateY(0);} }

  .abre-sub{
    margin-top:clamp(18px,2.6vh,28px);
    font-family:var(--serif); font-style:italic; font-weight:500;
    font-size:clamp(1.02rem,2.2vw,1.4rem); line-height:1.35; color:var(--teal-deep);
    max-width:28ch;
    opacity:0; animation:sube 900ms var(--ease) 2.05s forwards;
  }

  /* ── señal de scroll ── */
  .abre-cue{
    /* Se centra con márgenes, no con translateX: la animación de entrada
       anima `transform` y borraría el centrado a mitad de camino. */
    position:absolute; left:0; right:0; margin-inline:auto; width:fit-content;
    bottom:clamp(26px,4vh,44px);
    display:flex; flex-direction:column; align-items:center; gap:9px;
    font-family:var(--mono); font-size:.6rem; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-3);
    opacity:0; animation:sube 900ms var(--ease) 2.5s forwards;
  }
  .abre-cue .riel{width:1px; height:38px; background:var(--line); position:relative; overflow:hidden;}
  .abre-cue .riel::after{
    content:''; position:absolute; inset:0; background:var(--teal);
    transform:translateY(-100%); animation:baja 1900ms var(--ease) 3s infinite;
  }
  @keyframes baja{ 0%{transform:translateY(-100%)} 55%{transform:translateY(100%)} 100%{transform:translateY(100%)} }

  /* ── la foto entra después ── */
  .abre-foto{padding-bottom:clamp(56px,9vw,100px);}
  .abre-foto .shot{
    animation:fotoEntra 1400ms var(--ease) 2.2s both;
  }
  @keyframes fotoEntra{
    from{opacity:0; transform:scale(1.05) translateY(28px);}
    to  {opacity:1; transform:none;}
  }

  /* Portátiles de pantalla baja: menos aire arriba y abajo para que
     la señal de scroll no se coma el subtítulo. */
  @media (max-height:780px){
    .abre{padding-top:clamp(40px,6vh,70px); padding-bottom:clamp(64px,9vh,90px);}
    .abre-sello{width:clamp(84px,9vw,120px);}
    .abre-word{margin-top:clamp(18px,2.6vh,30px); font-size:clamp(2.4rem,8.4vw,4.6rem);}
    .abre-linea{margin-top:clamp(24px,3.4vh,40px); font-size:clamp(1.45rem,3.4vw,2.4rem);}
    .abre-sub{margin-top:clamp(14px,1.8vh,20px);}
  }

  @media (prefers-reduced-motion: reduce){
    .abre-sello, .abre-word, .abre-word i, .abre-tag, .abre-sub,
    .abre-cue, .abre-foto .shot{animation:none !important; opacity:1 !important; transform:none !important;}
    .abre-word{letter-spacing:.02em; text-indent:.02em;}
    .abre-linea .mask > span{transform:none !important; animation:none !important;}
    .abre-cue .riel::after{animation:none !important;}
  }

  /* ── barra de la demo ── */
  .barra{
    position:fixed; right:16px; bottom:16px; z-index:40;
    display:flex; gap:8px; align-items:center;
    background:rgba(30,29,26,.9); backdrop-filter:blur(10px);
    border-radius:999px; padding:8px 10px 8px 18px;
  }
  .barra span{font-family:var(--mono); font-size:.6rem; letter-spacing:.1em; text-transform:uppercase; color:rgba(243,239,233,.6);}
  .barra button{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase;
    background:var(--teal); color:#fff; border-radius:999px; padding:8px 15px; cursor:pointer;
  }
  .barra button:hover{background:#2E9FB4;}
  .barra a{
    font-family:var(--mono); font-size:.62rem; letter-spacing:.08em; text-transform:uppercase;
    color:rgba(243,239,233,.75); padding:8px 12px; border-radius:999px; border:1px solid rgba(243,239,233,.2);
  }
  .barra a:hover{color:#fff; border-color:rgba(243,239,233,.45);}
</style>
</head>

<body>

<!-- ══════════ APERTURA ══════════ -->
<section class="abre" id="abre" data-ground="linen">
  <img class="abre-sello" src="/assets/img/seal.svg" alt="Healing Through Movement" width="168" height="168">

  <span class="abre-word" aria-label="THRIVE"><i style="--i:0">t</i><i style="--i:1">h</i><i style="--i:2">r</i><i style="--i:3">i</i><i style="--i:4">v</i><i style="--i:5">e</i></span>
  <span class="abre-tag">Small Group Strength for Women</span>

  <h1 class="abre-linea">
    <span class="mask m1"><span>Strength for the life</span></span>
    <span class="mask m2"><span>you want to keep</span></span>
    <span class="mask m3"><span><em>living.</em></span></span>
  </h1>

  <p class="abre-sub">No tenés que esperar a perder capacidad para empezar a construirla.</p>

  <div class="abre-cue" aria-hidden="true">
    <span class="riel"></span>
    Seguí bajando
  </div>
</section>

<!-- ══════════ LA FOTO Y LA ACCIÓN ══════════ -->
<div class="abre-foto" data-ground="linen">
  <div class="wide" style="display:flex; flex-direction:column; align-items:center; text-align:center;">
    <div class="shot" style="width:min(880px,100%); aspect-ratio:16/10;">
      <img class="plx" data-plx src="/assets/img/hero.jpg" alt="Mujer entrenando en el estudio" width="1040" height="650">
    </div>
    <p class="photo-note">Foto de referencia — pendiente sesión de HTM</p>

    <div class="cta-wrap">
      <a class="cta" data-wa href="#">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.8-.6-3.1-1.3-5.1-4.4-5.3-4.6-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .7.5l.9 2.2c.1.2.1.4 0 .6l-.4.5-.3.4c-.1.1-.2.3 0 .6.2.3.8 1.4 1.8 2.2 1.2 1.1 2.2 1.4 2.5 1.6.3.1.5.1.6-.1l.9-1c.2-.2.4-.2.6-.1l2.1 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg>
        Quiero probar THRIVE
      </a>
      <span class="cta-fine">Solo 4 espacios por grupo</span>
    </div>
  </div>
</div>

<div class="barra">
  <span>Demo del hero</span>
  <button type="button" id="repetir">Repetir</button>
  <a href="/thrive/">Ver la actual</a>
</div>

<script src="/config.js?v=881bb8eb"></script>
<script src="/assets/js/thrive.js?v=e95070c6"></script>
<script>
(function(){
  var btn = document.getElementById('repetir');
  var abre = document.getElementById('abre');
  var foto = document.querySelector('.abre-foto');
  btn.addEventListener('click', function(){
    scrollTo({top:0, behavior:'smooth'});
    /* reiniciar la secuencia: se clona el nodo para que los keyframes
       vuelvan a correr desde cero */
    [abre, foto].forEach(function(n){
      var copia = n.cloneNode(true);
      n.parentNode.replaceChild(copia, n);
    });
    abre = document.getElementById('abre');
    foto = document.querySelector('.abre-foto');
  });
})();
</script>
</body>
</html>
