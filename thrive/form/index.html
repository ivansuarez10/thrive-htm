  (function(){

    setTimeout(function () {

    setTimeout(function () {

  var elSteps = document.getElementById('steps');

  /* ═══ las cuatro partes ═══

  var PARTES = [
    {
      hasta:'sobre_vos', nombre:'Para conocerte', titulo:null
    },
    {

  /* ═══ los dos formularios ═══
     El público son las 16 preguntas de Denisse. La INVITACIÓN DIRECTA son
     nueve: va dirigida a alguien que ella ya conoce —una former o una
     conocida— y preguntarle de cero lo que ya sabe es no haberla escuchado.

     ⚠️ Los dos comparten las MISMAS definiciones de pregunta, y eso no es
     por ahorrar código. `alerta_salud` es una columna GENERADA en la base
     que compara el texto exacto de las respuestas 'restriccion' y
     'sintomas' contra 'Sí.' —con tilde y con punto—. Si hubiera dos
     formularios con dos definiciones, el día que una cambie una coma la
     alerta empieza a devolver «sin riesgo» EN SILENCIO. Compartiendo los
     objetos, divergir es imposible.

     Denisse lo pidió explícito: «si alguna respuesta activa un flag, debe
     aparecer Revisar salud en el panel». */
  var MODO = 'publico';
  try{
    if(new URLSearchParams(location.search).get('v') === 'directa') MODO = 'directa';
  }catch(e){}

  if(MODO === 'directa'){
    /* El teléfono va casi al final, igual que en el público. Estaba de

    var CORTO = ['nombre','conocemos','grupo','meta','dolor','restriccion','sintomas','compromiso','telefono','imagen'];

    PREGUNTAS[PREGUNTAS.length - 1] = Object.assign({}, PREGUNTAS[PREGUNTAS.length - 1], { cierre:true });

    /* Una sola pantalla de parte, la de salud: es la única que se gana el

    PARTES = [

  (function(){

    if(MODO === 'directa'){

  var PANTALLAS = [];
  (function(){

    PARTES.forEach(function(parte, n){

  /* ═══ construir las pantallas ═══ */
  PANTALLAS.forEach(function(pantalla, pIdx){

    }

    var q = pantalla.q;

    /* El cuerpo se centra en lo que sobra de pantalla; el pie se queda

    var cuerpo = document.createElement('div');

    var largo = q.titulo.length;

    if(q.tipo === 'corta'){

    } else if(q.tipo === 'texto'){

            var pos = actual.indexOf(txt);

            resp[q.id] = actual;

            resp[q.id] = txt;
            body.querySelectorAll('.opt').forEach(function(o){ o.setAttribute('aria-pressed','false'); });
            b.setAttribute('aria-pressed','true');

            /* Un sí de salud abre su campo y NO avanza solo: lo que
               importa de esa respuesta es el detalle, no el sí. */
            var det = step.querySelector('.detalle');
            if(pide){
              det.querySelector('textarea').placeholder = pide;
              det.hidden = false;
              setTimeout(function(){ det.querySelector('textarea').focus(); }, 60);
              refrescarBoton(pIdx);
            } else {
              if(det){
                resp[q.id + '_detalle'] = '';
                det.querySelector('textarea').value = '';
                /* §7 · se retira por el mismo camino por el que entró.
                   Antes se le ponía hidden y se cortaba de un cuadro al
                   otro; el CSS ya no tiene solo @keyframes abre, ahora
                   tiene su par (@keyframes cierra, clase .yendo).

                   El hidden NUNCA depende de que llegue un evento: si el
                   navegador no corre la animación —movimiento reducido— o
                   animationend no dispara —la pestaña se ocultó a mitad—,
                   el campo quedaría abierto para siempre. De ahí el
                   temporizador de red. cerrar() es idempotente. */
                if(!det.hidden){

                    det.hidden = true;
                  } else {
                    det.classList.add('yendo');
                    var cerrar = function(){
                      det.hidden = true;
                      det.classList.remove('yendo');
                      det.removeEventListener('animationend', cerrar);
                    };
                    det.addEventListener('animationend', cerrar);
                    setTimeout(cerrar, 400);
                  }
                }
              }
              if(!q.cierre){ setTimeout(function(){ ir(pIdx + 1); }, 260); }
              else pintarSiguiente(step, q);
            }
          }
        });
        body.appendChild(b);

      if(q.opciones.some(function(o){ return typeof o !== 'string' && o.pide; })){

        det.hidden = true;

        body.appendChild(det);
      }
    }

    /* consentimiento, solo en la última */
    if(q.cierre){
      ANTES_DE_ENVIAR.forEach(function(t, n){
        var pp = document.createElement('p');
        pp.className = 'body';
        pp.style.marginTop = n === 0 ? '30px' : '14px';
        pp.textContent = t;
        cuerpo.appendChild(pp);
      });
      var cons = document.createElement('button');
      cons.type = 'button';
      cons.className = 'consent';
      /* aria-checked sólo significa algo en un role que pueda marcarse.
         En un <button> pelado el lector anuncia «botón» y se calla el
         estado: la persona no sabe si ya consintió. (Auditoría 30 ago.) */
      cons.setAttribute('role','checkbox');
      cons.setAttribute('aria-checked','false');
      var cm = document.createElement('span'); cm.className = 'mark';
      cons.appendChild(cm);
      cons.appendChild(document.createTextNode(CONSENTIMIENTO));
      cons.addEventListener('click', function(){
        consiente = !consiente;
        cons.setAttribute('aria-checked', consiente ? 'true' : 'false');
        pintarSiguiente(step, q);
      });
      cuerpo.appendChild(cons);
    }

    var foot = document.createElement('div');
    foot.className = 'step-foot';
    var next = document.createElement('button');
    next.type = 'button';
    next.className = 'cta';
    next.textContent = q.cierre ? 'Enviar' : 'Siguiente';
    next.addEventListener('click', function(){
      if(q.cierre) enviar(next);
      else ir(pIdx + 1);
    });
    foot.appendChild(next);
    var err = document.createElement('p');
    err.className = 'err';
    /* role=alert: cuando el texto cambia, el lector de pantalla lo lee de
       inmediato. Sin esto, quien no ve la pantalla toca «Siguiente», nada
       avanza, y nadie le dice por qué. (Auditoría 30 ago 2026.) */
    err.setAttribute('role', 'alert');
    foot.appendChild(err);
    step.appendChild(foot);

    elSteps.appendChild(step);
  });

  /* El botón de una pantalla de texto/múltiple se apaga si falta lo obligatorio */
  function pintarSiguiente(step, q){
    var btn = step.querySelector('.step-foot .cta');
    if(!btn) return;
    var v = resp[q.id];
    var lleno = q.opcional ? true
      : (q.tipo === 'multi' ? (v && v.length) : (typeof v === 'string' ? v.length > 0 : !!v));

    /* Algunas preguntas necesitan más que «no está vacío». El teléfono es
       la única puerta de contacto desde que la landing manda acá en vez
       de a WhatsApp: uno mal escrito se ve igual que uno bueno hasta que
       Denisse intenta escribirle. */
    if(lleno && typeof q.valida === 'function' && !q.valida(v)) lleno = false;

    /* un sí sin el detalle no sirve para entrenarla segura */
    var det = step.querySelector('.detalle');
    if(det && !det.hidden && !(resp[q.id + '_detalle'] || '').length) lleno = false;

    var ok = lleno && (!q.cierre || consiente);
    btn.disabled = !ok;
  }

  /* Las de opción única sin cierre no muestran botón: avanzan al tocar */
  function refrescarBoton(p){
    var pantalla = PANTALLAS[p];
    if(!pantalla || pantalla.tipo !== 'q') return;
    var q = pantalla.q;
    var step = elSteps.children[p];
    var foot = step.querySelector('.step-foot');
    var d = step.querySelector('.detalle');
    var abierto = d && !d.hidden;
    if(q.tipo === 'unica' && !q.cierre && !abierto){ foot.hidden = true; return; }
    foot.hidden = false;
    pintarSiguiente(step, q);
  }

  function pintarTramos(p){
    for(var c = 0; c < PARTES.length; c++){
      var v = c < p.n ? 1
            : c > p.n ? 0
            : (p.tipo === 'parte' ? 0 : p.en / p.de);
      tramos[c].style.transform = 'scaleX(' + v + ')';
    }
  }

  function ir(n){
    if(n >= PANTALLAS.length) n = PANTALLAS.length - 1;
    if(n < 0) n = 0;
    for(var k = 0; k < elSteps.children.length; k++) elSteps.children[k].hidden = (k !== n);
    i = n;
    var p = PANTALLAS[n];
    /* En la pantalla de parte el rótulo repetiría el titular. */
    elCount.textContent = p.tipo === 'parte' ? ''
      : (PARTES[p.n].nombre + ' · ' + p.en + ' de ' + p.de);
    pintarTramos(p);
    /* Preguntas cuyo texto depende de una respuesta anterior. Se reescribe al
       MOSTRARLA y no al construirla: cuando se arma el formulario, la respuesta
       que decide todavía no existe. Si vuelve atrás y cambia de grupo, al pasar
       de nuevo por acá el titular ya dice la fecha nueva. */
    if(p.tipo === 'q' && (p.q.segunGrupo || p.q.segunModo || p.q.segunConocemos)){
      var h1 = elSteps.children[n].querySelector('.q-title');
      if(h1){
        var t = p.q.titulo;
        /* De lo más general a lo más específico: el modo cambia la pregunta,
           y la respuesta de «cómo nos conocemos» la afina todavía más. */
        if(p.q.segunModo && p.q.segunModo[MODO]) t = p.q.segunModo[MODO];
        if(p.q.segunGrupo){
          var g = /^THRIVE (2X|3X)/.exec(resp.grupo || '');
          if(g && p.q.segunGrupo[g[1]]) t = p.q.segunGrupo[g[1]];
        }
        if(p.q.segunConocemos && p.q.segunConocemos[resp.conocemos]) t = p.q.segunConocemos[resp.conocemos];
        h1.textContent = t;
      }
    }
    elBack.hidden = (n === 0);
    refrescarBoton(n);
    var f = elSteps.children[n].querySelector('.field');
    if(f) setTimeout(function(){ f.focus(); }, 120);
    else {
      /* En los pasos de opciones el foco se quedaba en <body>: quien navega
         con teclado o lector tenía que recorrer la página desde cero en
         CADA pregunta. Se enfoca el titular —no la primera opción, que se
         leería como «ya hay una elegida»—. (Auditoría 30 ago 2026.) */
      var t = elSteps.children[n].querySelector('.q-title, h2');
      if(t){ t.setAttribute('tabindex','-1'); setTimeout(function(){ t.focus({preventScroll:true}); }, 120); }
    }
    try{ scrollTo({top:0, behavior:'smooth'}); }catch(e){ scrollTo(0,0); }
  }

  elBack.addEventListener('click', function(){ ir(i - 1); });

  /* ═══ envío ═══ */
  function armarPayload(){
    /* El nombre de quien refirió puede venir horneado en la página o
       escrito por ella en la pregunta 3. Manda el horneado, que es el
       que no se equivoca. */
    var refiere = (window.THRIVE_RT && window.THRIVE_RT.referida)
                  || resp.referida || null;
    /* La 13 ya dice qué grupo quiere. Sin esto la columna queda en null,
       Denisse vuelve a teclear lo que la clienta ya contestó, y la vista
       'cupos' —que cuenta por grupo— dice ocho libres para siempre.
       'Todavía no estoy segura' se queda en null a propósito: es null. */
    var g = /^THRIVE (2X|3X)/.exec(resp.grupo || '');

    return {
      nombre: resp.nombre || 'Sin nombre',
      /* Desde el 27 ago la landing manda acá en vez de a WhatsApp, así
         que éste es el ÚNICO lugar donde se captura el número. Antes se
         daba por sabido porque la conversación empezaba por WhatsApp. */
      telefono: (resp.telefono || '').trim() || null,
      /* Explícito y no por defecto: el día que exista el segundo programa,
         su formulario tiene que mandar el suyo, y esta línea es el recordatorio. */
      programa: 'thrive',
      referida_por: refiere,
      grupo: g ? g[1] : null,
      respuestas: resp,
      consentimiento: consiente,
      /* 'invitacion' es la tercera vía: alguien que Denisse invitó
         personalmente. El panel la usa para NO pedirle agendar una clase de
         prueba que ella decidió que no es obligatoria en este camino. */
      origen: MODO === 'directa' ? 'invitacion' : 'formulario',
      estado: 'formulario'
    };
  }

  /* Antes esto mandaba el formulario ENTERO por WhatsApp, información de
     salud incluida. Las respuestas ya llegaron por el formulario: no hay
     ninguna razón para duplicarlas en un canal que no controlamos. */
  function textoCoordinar(){
    /* En invitación directa no hay clase de prueba que coordinar: ella
       revisa y escribe. El botón queda por si la persona prefiere hablar
       antes, pero no puede prometer una clase que no se ofreció. */
    if(MODO === 'directa'){
      return 'Hola, Denisse! Acabo de mandarte el formulario de la invitación a THRIVE.';
    }
    return 'Hola, Denisse! Acabo de completar el formulario de THRIVE y me gustaría coordinar mi clase de prueba.';
  }

  function enviar(btn){
    var err = btn.parentElement.querySelector('.err');
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = 'Enviando…';

    var payload = armarPayload();
    var sb = CFG.supabase || {};

    /* ⚠️ El 28 ago 2026 una candidata llenó el formulario, vio «Listo, ya
       me llegó», y su fila NUNCA existió en la base. El .catch de acá
       abajo mostraba el cierre de éxito pasara lo que pasara: la persona
       creía estar inscrita, Denisse no se enteraba de nada, y el único
       rastro era el WhatsApp que ella misma tocó al final.
       La intención era buena —no dejarla con la sensación de haber
       perdido el tiempo— pero mentirle es peor que decepcionarla. */
    /* La pantalla de espera se abre ACÁ, antes de tocar la base: lo que
       la persona ve mientras tanto es el check trabajando, y ese trabajo
       es real. Antes esta pantalla aparecía recién al final, ya resuelta. */
    abrirEspera();

    function terminar(ok){
      contestoLaBase(payload, ok !== false);
    }

    /* Se guarda ANTES de intentar, no después: si el navegador se cierra
       en el medio, sus respuestas siguen acá y el reintento las encuentra. */
    function recordar(){
      try{ localStorage.setItem('thrive-sin-enviar', JSON.stringify(payload)); }catch(e){}
    }
    function olvidar(){
      try{ localStorage.removeItem('thrive-sin-enviar'); }catch(e){}
    }

    if(!sb.enabled || !sb.url || !sb.anonKey){
      /* Sin backend configurado esto es un entorno de prueba, no un fallo
         de red: se avisa en consola y se cierra como si hubiera entrado. */
      console.info('[THRIVE] Supabase apagado. Respuestas:', payload);
      terminar(true);
      return;
    }

    recordar();

    function intentar(){
      return fetch(sb.url.replace(/\/$/,'') + '/rest/v1/' + (sb.table || 'thrive_screening'), {
        method:'POST',
        headers:{
          'Content-Type':'application/json',
          'apikey': sb.anonKey,
          'Authorization':'Bearer ' + sb.anonKey,
          'Prefer':'return=minimal'
        },
        body: JSON.stringify(payload)
      }).then(function(r){
        if(!r.ok) return r.text().then(function(t){ throw new Error('HTTP ' + r.status + ' ' + t.slice(0,180)); });
      });
    }

    /* Un reintento y nada más. La mayoría de los fallos son un parpadeo de
       red y se resuelven solos; si el segundo también falla, insistir en
       silencio solo alarga la espera de alguien que ya terminó. */
    intentar()
      .catch(function(e){
        console.warn('[THRIVE] primer intento falló, reintentando:', e.message);
        return new Promise(function(r){ setTimeout(r, 1500); }).then(intentar);
      })
      .then(function(){ olvidar(); terminar(true); })
      .catch(function(e){
        console.error('[THRIVE] no se pudo guardar:', e);
        terminar(false);
      });
  }


  /* El cierre tiene dos versiones y la diferencia importa: una dice que
     llegó y la otra dice que no. Antes había una sola y decía siempre
     que sí.
     ⚠️ Las DOS se escriben enteras. Escribir solo la mala y no restaurar
     la buena deja el título de error después de un reintento exitoso:
     pasó, se vio probando, y es peor que el bug original — decirle que
     falló cuando sí entró la manda a escribir por gusto. */
  /* El cierre de la invitación directa es otro, y la diferencia es el
     punto entero de esta vía: acá NO se agenda nada. Texto de Denisse,
     29 ago 2026. */
  var CIERRE_DIRECTA = {
    titulo: 'Listo',
    t1: 'Ya me llegó. Voy a revisar tus respuestas y te escribo personalmente para que platiquemos y definamos si THRIVE hace sentido para vos y cuál grupo sería el mejor fit.',
    t2: '<b>No necesitás agendar nada por ahora.</b>',
    firma: '<strong>Denisse</strong>'
  };

  var CIERRE_OK = {
    titulo: 'Listo, ya me llegó',
    t1: 'Voy a leer tus respuestas con calma y te escribo por WhatsApp para coordinar el día de tu clase de prueba. Normalmente el mismo día; si me escribiste un fin de semana, el lunes.',
    t2: 'Mientras tanto no tenés que hacer nada. Si algo cambia de tu lado, escribime nomás.',
    firma: 'Nos vemos pronto,<br><strong>Denisse</strong>'
  };

  /* ── el cierre, en dos tiempos ──────────────────────────────
     ⚠️ La clase .arma —la que cierra el aro y dibuja el visto— NO se
     pone al tocar «Enviar». Se pone cuando la base YA contestó. Si
     alguien la adelanta «para que se vea más rápido», vuelve el bug
     del 28 ago 2026: un visto dibujado sobre una fila que no existe. */

  /* Una base rápida haría un parpadeo que se lee como error. Con este
     mínimo se lee como trabajo. */
  var MINIMO_ESPERA = 1400;
  var abrioEspera = 0, relojesCierre = [];
  function esperarCierre(ms, fn){ relojesCierre.push(setTimeout(fn, ms)); }

  function abrirEspera(){
    relojesCierre.forEach(clearTimeout); relojesCierre = [];
    abrioEspera = Date.now();
    elShell.hidden = true;
    elListo.hidden = false;
    var n = document.getElementById('cierreNucleo');
    var q = document.getElementById('cierreIcono');
    var e = document.getElementById('cierreEspera');
    var m = document.getElementById('cierreMsg');
    if(n){ n.hidden = false; n.className = 'cierre-nucleo'; }
    if(q){ q.className = 'cheque espera'; }
    if(e){ e.hidden = false; e.textContent = 'Guardando tus respuestas…'; }
    if(m){ m.hidden = true; m.classList.remove('llega'); }
    try{ scrollTo(0,0); }catch(err){}
  }

  function contestoLaBase(payload, ok){
    /* Si contestó antes del mínimo, se completa la espera. No es teatro:
       la escritura ya ocurrió, lo que se completa es el tiempo de lectura
       de la persona. */
    var falta = MINIMO_ESPERA - (Date.now() - abrioEspera);
    if(falta > 0){ esperarCierre(falta, function(){ contestoLaBase(payload, ok); }); return; }

    var n = document.getElementById('cierreNucleo');
    var q = document.getElementById('cierreIcono');
    var m = document.getElementById('cierreMsg');
    pintarCierre(payload, ok);

    function mostrarMensaje(){
      if(!m) return;
      m.hidden = false;
      requestAnimationFrame(function(){ m.classList.add('llega'); });
      /* Sin esto, quien usa lector de pantalla se queda oyendo
         «guardando tus respuestas» y nunca se entera del desenlace. */
      try{ m.setAttribute('tabindex','-1'); m.focus({preventScroll:true}); }catch(err){}
    }

    if(ok){
      if(q) q.className = 'cheque arma';
      if(n) n.classList.add('resuelto');
      esperarCierre(1240, function(){
        if(n) n.classList.add('sale');
        mostrarMensaje();
        esperarCierre(460, function(){ if(n) n.hidden = true; });
      });
    }else{
      /* Sin ceremonia: quien necesita reintentar no tiene por qué
         esperar una despedida. */
      if(q) q.className = 'cheque mal';
      if(n) n.classList.add('falla');
      esperarCierre(240, function(){
        if(n) n.hidden = true;
        mostrarMensaje();
      });
    }
  }

  function pintarCierre(payload, ok){
    var poner = function(id, html){ var e=document.getElementById(id); if(e) e.innerHTML = html; };

    if(ok){
      var C = MODO === 'directa' ? CIERRE_DIRECTA : CIERRE_OK;
      poner('cierreTitulo', C.titulo);
      poner('cierreTexto1', C.t1);
      poner('cierreTexto2', C.t2);
      poner('cierreFirma', C.firma);
    }else{
      poner('cierreTitulo', 'No se pudo guardar tu formulario');
      poner('cierreTexto1', 'Tus respuestas <b>no se perdieron</b>: quedaron guardadas en este teléfono. Probá de nuevo con el botón de abajo.');
      poner('cierreTexto2', 'Si vuelve a fallar, escribile a Denisse por WhatsApp y ella lo resuelve con vos. No hace falta que llenes todo otra vez.');
      poner('cierreFirma', '');
    }

    var cont = document.getElementById('cierreAcciones');
    cont.innerHTML = '';

    if(!ok){
      var re = document.createElement('button');
      re.className = 'cta';
      re.type = 'button';
      re.textContent = 'Reintentar';
      re.addEventListener('click', function(){
        re.disabled = true; re.textContent = 'Enviando…';
        document.getElementById('listo').hidden = true;
        elShell.hidden = false;
        /* Vuelve a la última pantalla con su botón, que es la que sabe
           enviar: no se reimplementa el envío en dos sitios. */
        var b = elShell.querySelector('.step:not([hidden]) .step-foot .cta');
        if(b){ b.disabled = false; enviar(b); }
        else { location.reload(); }
      });
      cont.appendChild(re);
    }

    var a = document.createElement('a');
    a.className = ok ? 'cta wa' : 'cta wa secundario';
    a.setAttribute('data-wa','');
    a.href = (window.THRIVE_RT ? window.THRIVE_RT.linkWhatsApp(textoCoordinar()) : '#');
    a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.8 14.2c-.2.7-1.4 1.3-2 1.4-.5.1-1.2.1-1.9-.1-.4-.1-1-.3-1.8-.6-3.1-1.3-5.1-4.4-5.3-4.6-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .7.5l.9 2.2c.1.2.1.4 0 .6l-.4.5-.3.4c-.1.1-.2.3 0 .6.2.3.8 1.4 1.8 2.2 1.2 1.1 2.2 1.4 2.5 1.6.3.1.5.1.6-.1l.9-1c.2-.2.4-.2.6-.1l2.1 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3Z"/></svg> Coordinar mi clase de prueba por WhatsApp';
    cont.appendChild(a);
  }

  ir(0);
})();
</script>
</body>
